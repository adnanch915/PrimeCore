<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>PrimeCore</title>
<style>
:root{--navy:#1b1f3b;--purple:#6d28d9;--purple2:#a78bfa;--bg:#f1f5f9;--text:#0f172a;--muted:#64748b;--card:#fff;--line:#e2e8f0}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%}
a{color:var(--purple);text-decoration:none}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;position:sticky;top:0;z-index:10;flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;margin-right:auto}
.brand span{color:var(--purple2)}
nav{display:flex;gap:4px;overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch;width:100%}
nav a{color:#c9cbe6;padding:8px 10px;border-radius:10px;font-size:14px;white-space:nowrap}
nav a.on,nav a:hover{background:var(--purple);color:#fff}
main{padding:16px;max-width:1200px;margin:0 auto}
h1{font-size:22px;margin:6px 0 14px}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:14px;margin:0 0 8px}
.muted{color:var(--muted);font-size:13px}
.two{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.cols3{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.cols4{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.card{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 2px 10px rgba(15,23,42,.06);border:1px solid var(--line);min-width:0;margin-bottom:14px;transition:transform .15s ease,box-shadow .15s ease}
.stat{color:#fff;border-radius:16px;padding:18px;background:linear-gradient(135deg,var(--purple),#6366f1);min-width:0;margin-bottom:14px}
.stat.dark{background:linear-gradient(135deg,var(--navy),#3b4a8f)}
.stat.green{background:linear-gradient(135deg,#059669,#14b8a6)}
.stat.amber{background:linear-gradient(135deg,#d97706,#f59e0b)}
.stat small{opacity:.9;font-size:13px}
.stat b{display:block;font-size:24px;margin-top:6px;word-break:break-word}
button{background:linear-gradient(90deg,var(--purple),#8b5cf6);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;font-size:15px;min-height:44px;font-family:inherit}
button:disabled{opacity:.5;cursor:not-allowed}
button.ghost{background:#fff;color:var(--purple);border:1px solid var(--purple)}
button.small{padding:6px 10px;font-size:13px;min-height:34px;margin:2px 4px 2px 0}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;margin-top:4px;background:#fff;font-family:inherit}
label{display:block;font-size:13px;color:#334155;margin-bottom:10px}
.auth{max-width:440px;margin:24px auto}
table{width:100%;border-collapse:collapse;font-size:14px}
.wide{overflow-x:auto}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-size:12px;font-weight:600}
.pill{font-size:12px;border-radius:99px;padding:2px 9px;font-weight:600;white-space:nowrap;display:inline-block}
.p-ok{background:#d1fae5;color:#059669}.p-wait{background:#fef3c7;color:#b45309}.p-bad{background:#fee2e2;color:#dc2626}.p-off{background:#e2e8f0;color:#475569}.p-info{background:#ede9fe;color:#5b21b6}
.msg{padding:10px 12px;border-radius:10px;margin:0 0 14px;font-size:14px}
.msg.ok{background:#d1fae5;color:#065f46}.msg.err{background:#fee2e2;color:#991b1b}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
ul.tree{list-style:none;margin:0;padding-left:16px;border-left:2px solid #ddd6fe}
ul.tree li{margin:8px 0}
details summary{cursor:pointer;padding:4px 0}
.av{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#7c3aed;color:#fff;font-size:12px;vertical-align:middle}
.notice{background:#fef3c7;color:#92400e;padding:12px 14px;border-radius:12px;margin-bottom:14px;font-size:14px}
.prog{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin:8px 0}
.prog > i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),#14b8a6);border-radius:99px}
.kpi{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kpi:last-child{border-bottom:0}
.plan-active{border:2px solid var(--purple);box-shadow:0 4px 16px rgba(109,40,217,.14)}
@media (max-width:640px){
  main{padding:12px}
  .two{grid-template-columns:1fr}
  h1{font-size:20px}
  .brand{width:100%}
  .stat b{font-size:21px}
  .row{align-items:flex-start}
}
</style>
</head>
<body>
<header>
  <div class="brand">Prime<span>Core</span></div>
  <button class="ghost" id="logout" style="display:none;min-height:36px;padding:6px 12px;width:auto">Sign out</button>
  <nav id="nav" aria-label="Main"></nav>
</header>
<main id="app"><p class="muted">Loading…</p></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function () {
'use strict';

/* ==================== CONFIGURATION ====================
   Public values only: the project URL and the ANON public key from
   Supabase > Project Settings > API. Never place the service_role key here. */
var SUPABASE_URL = 'https://qufxjfntdqhympultbx.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_639f9uEApKsGgOtQW_J9Jg_M-nnwtnB';

var CONFIGURED = /^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(SUPABASE_URL) &&
  SUPABASE_ANON_KEY.length > 20 && SUPABASE_ANON_KEY.indexOf('YOUR-') !== 0;
var LIB_OK = !!(window.supabase && window.supabase.createClient);
var sb = (CONFIGURED && LIB_OK) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
}) : null;

/* ==================== DEFAULT PLAN & PROGRAM CONFIG ==================== */
var DEFAULT_PLANS = [
  { code: 'JUNIOR', name: 'JUNIOR', min_amount: 30, max_amount: 500, proposed_daily_rate: 1.0, lock_days: 30, fee_pct: 2.0, eligibility_note: 'Verified account & minimum $30 valid balance', is_active: true },
  { code: 'SENIOR', name: 'SENIOR', min_amount: 501, max_amount: 1500, proposed_daily_rate: 1.5, lock_days: 30, fee_pct: 2.0, eligibility_note: 'Verified account & $501–$1,500 valid balance', is_active: true },
  { code: 'SPECIAL', name: 'SPECIAL', min_amount: 1501, max_amount: 5000, proposed_daily_rate: 2.0, lock_days: 45, fee_pct: 1.5, eligibility_note: 'Verified account & $1,501–$5,000 valid balance', is_active: true },
  { code: 'ELITE', name: 'ELITE', min_amount: 5001, max_amount: 20000, proposed_daily_rate: 2.5, lock_days: 60, fee_pct: 1.0, eligibility_note: 'Verified KYC & $5,001–$20,000 valid balance', is_active: true },
  { code: 'UNIVERSAL', name: 'UNIVERSAL', min_amount: 20001, max_amount: 50000, proposed_daily_rate: 3.0, lock_days: 90, fee_pct: 0.5, eligibility_note: 'Verified KYC & $20,001–$50,000 valid balance', is_active: true }
];

var DEFAULT_SETTINGS = {
  level_1_rate: 10, level_1_target: 2,
  level_2_rate: 7,  level_2_target: 5,
  level_3_rate: 3,  level_3_target: 10,
  challenge_5_reward: 15,
  challenge_10_reward: 30,
  challenge_20_reward: 50,
  funded_reward_budget: 0,
  min_qualifying_deposit: 30,
  compounding_enabled: false,
  auto_credit_enabled: false
};

/* ==================== STATE & HELPERS ==================== */
var S = { ready: false, user: null, profile: null, msg: null, pendingEmail: '', view: 'dashboard' };
var seq = 0;
var AUTH = ['login', 'signup', 'verify', 'forgot', 'reset'];
var NAV = [
  ['dashboard', 'Dashboard'], ['tasks', 'Tasks'], ['daily', 'Daily Reward'], ['wallet', 'Wallet'],
  ['investment', 'Investment'], ['team', 'My Team'], ['profit', 'Profit'], ['leaderboard', 'Leaderboard'],
  ['notifications', 'Notifications'], ['profile', 'Profile'], ['settings', 'Settings'], ['help', 'Help']
];
var DIALS = [
  ['US','United States','+1'],['CA','Canada','+1'],['GB','United Kingdom','+44'],['AU','Australia','+61'],
  ['DE','Germany','+49'],['FR','France','+33'],['ES','Spain','+34'],['IT','Italy','+39'],['NL','Netherlands','+31'],
  ['BR','Brazil','+55'],['MX','Mexico','+52'],['NG','Nigeria','+234'],['GH','Ghana','+233'],['KE','Kenya','+254'],
  ['ZA','South Africa','+27'],['EG','Egypt','+20'],['AE','United Arab Emirates','+971'],['SA','Saudi Arabia','+966'],
  ['TR','Turkey','+90'],['IN','India','+91'],['PK','Pakistan','+92'],['BD','Bangladesh','+880'],['PH','Philippines','+63'],
  ['ID','Indonesia','+62'],['MY','Malaysia','+60'],['SG','Singapore','+65'],['TH','Thailand','+66'],['VN','Vietnam','+84'],
  ['JP','Japan','+81'],['KR','South Korea','+82'],['CN','China','+86']
];
var KIND = {
  deposit_credit: 'Deposit', withdrawal: 'Withdrawal', investment_debit: 'Investment',
  reward_credit: 'Daily reward', task_credit: 'Task reward', referral_credit: 'Referral',
  claim_credit: 'Claim reward', compound_reinvest: 'Compounding reinvest', admin_adjustment: 'Adjustment'
};
var PILL = {
  pending: 'p-wait', PENDING: 'p-wait', submitted: 'p-wait',
  successful: 'p-ok', SUCCESS: 'p-ok', approved: 'p-ok', paid: 'p-ok', posted: 'p-ok',
  rejected: 'p-bad', REJECTED: 'p-bad', started: 'p-off', active: 'p-ok', completed: 'p-off'
};
var CLAIM_LABEL = { started: 'Not submitted', submitted: 'Pending', paid: 'Success', rejected: 'Rejected' };
var MSG = {
  insufficient_balance: 'Your available balance is not enough.',
  invalid_amount: 'Enter an amount of at least $10.',
  invalid_destination: 'Enter a valid destination.',
  already_started: 'You have already started this task.',
  not_submittable: 'This task cannot be submitted right now.',
  task_unavailable: 'This task is no longer available.',
  forbidden: 'Admin permission is required.',
  not_pending: 'This request was already processed.',
  not_submitted: 'This task is no longer awaiting review.',
  not_found: 'That record could not be found.',
  cannot_change_own_role: 'You cannot change your own role.',
  duplicate_claim_today: 'You have already submitted or claimed this milestone today.',
  insufficient_qualified_referrals: 'You have not met the verified qualified referral requirement yet.',
  insufficient_reward_budget: 'Funded reward budget is currently insufficient for this claim.',
  duplicate_cycle_today: 'A compounding cycle has already been processed for this 24-hour window.',
  no_verified_earnings: 'Only verified, eligible earnings can be compounded.',
  rewards_disabled_pending_legal_review: 'Automatic rewards are disabled unless funded by verified business revenue.',
  investments_disabled_pending_legal_review: 'Investments require verified eligibility and terms acceptance.'
};

var $ = function (s) { return document.querySelector(s); };
var esc = function (v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
};
var money = function (n) {
  return '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};
var when = function (d) { return d ? new Date(d).toLocaleString() : '—'; };
var pill = function (s) { return '<span class="pill ' + (PILL[s] || 'p-off') + '">' + esc(s) + '</span>'; };
var flag = function (cc) {
  return String.fromCodePoint.apply(null, cc.toUpperCase().split('').map(function (c) { return 127397 + c.charCodeAt(0); }));
};
var friendly = function (e) {
  var m = String((e && e.message) || e || '').trim();
  if (MSG[m]) return MSG[m];
  if (m.indexOf('Invalid login credentials') > -1) return 'Email or password is incorrect.';
  if (m.indexOf('Email not confirmed') > -1) return 'Verify your email before signing in.';
  if (m.indexOf('already registered') > -1) return 'An account with this email already exists.';
  if (m.indexOf('Token has expired') > -1 || (m.indexOf('invalid') > -1 && m.indexOf('Token') > -1)) return 'That code is invalid or expired. Request a new one.';
  if (m.indexOf('duplicate') > -1 || m.indexOf('profiles_username') > -1 || m.indexOf('Database error') > -1) {
    return 'That record already exists or username is taken.';
  }
  return m || 'Something went wrong. Please try again.';
};
var setMsg = function (t, m) { S.msg = { t: t, m: m }; };
var msgHTML = function () {
  var m = S.msg; S.msg = null;
  return m ? '<div class="msg ' + m.t + '" role="status">' + esc(m.m) + '</div>' : '';
};
var errorBox = function (e) {
  return '<div class="card"><div class="msg err">' + esc(friendly(e)) + '</div></div>';
};
var stat = function (label, value, cls) {
  return '<div class="' + cls + '"><small>' + esc(label) + '</small><b>' + money(value) + '</b></div>';
};
var isAdmin = function () {
  return !!(S.profile && (S.profile.role === 'admin' || S.profile.role === 'super_admin'));
};
var sum = function (rows) {
  return (rows || []).reduce(function (a, r) { return a + Number(r.amount || 0); }, 0);
};
var firstError = function (results) {
  for (var i = 0; i < results.length; i++) if (results[i].error) return results[i].error;
  return null;
};

async function loadPlans() {
  if (!sb) return DEFAULT_PLANS;
  var r = await sb.from('investment_plans').select('*').order('min_amount', { ascending: true });
  if (!r.error && r.data && r.data.length) return r.data;
  return DEFAULT_PLANS;
}

async function loadProgramSettings() {
  if (!sb) return Object.assign({}, DEFAULT_SETTINGS);
  var r = await sb.from('program_settings').select('*').eq('id', 1).maybeSingle();
  if (!r.error && r.data) return Object.assign({}, DEFAULT_SETTINGS, r.data);
  return Object.assign({}, DEFAULT_SETTINGS);
}

function matchPlan(plans, validBalance) {
  var b = Number(validBalance || 0);
  for (var i = 0; i < plans.length; i++) {
    var p = plans[i];
    if (p.is_active !== false && b >= Number(p.min_amount) && b <= Number(p.max_amount)) return p;
  }
  return null;
}

function authHTML(view) {
  var dialOpts = DIALS.map(function (c) {
    return '<option value="' + c[0] + '|' + c[2] + '">' + flag(c[0]) + ' ' + esc(c[1]) + ' (' + c[2] + ')</option>';
  }).join('');
  var box = function (title, sub, body) {
    return '<div class="card auth"><h1>' + title + '</h1><p class="muted">' + sub + '</p>' + body + '</div>';
  };
  if (view === 'signup') return box('Create account', 'Takes about a minute. We will email you a 6-digit code.',
    '<form data-form="signup">' +
    '<label>Full name<input name="full_name" required minlength="2" maxlength="80" autocomplete="name"></label>' +
    '<label>Username (3–20 letters, numbers or _)<input name="username" required pattern="[A-Za-z0-9_]{3,20}" autocomplete="username"></label>' +
    '<label>Email<input type="email" name="email" required autocomplete="email"></label>' +
    '<label>Country and code<select name="country">' + dialOpts + '</select></label>' +
    '<label>Phone number (without country code)<input name="phone" inputmode="tel" required></label>' +
    '<label>Password (8+ characters)<input type="password" name="password" minlength="8" required autocomplete="new-password"></label>' +
    '<label>Confirm password<input type="password" name="confirm" minlength="8" required autocomplete="new-password"></label>' +
    '<label>Referrer username (optional)<input name="ref"></label>' +
    '<button type="submit" style="width:100%">Create account</button></form>' +
    '<p class="muted">Already registered? <a href="#login">Sign in</a></p>');
  if (view === 'verify') return box('Verify your email', 'Enter the code sent to your email.',
    '<form data-form="verify">' +
    '<label>Email<input type="email" name="email" required value="' + esc(S.pendingEmail) + '"></label>' +
    '<label>6-digit code<input name="token" inputmode="numeric" pattern="[0-9]{6,8}" required autocomplete="one-time-code"></label>' +
    '<button type="submit" style="width:100%">Verify and continue</button></form>' +
    '<form data-form="resend" style="margin-top:12px"><label>Email<input type="email" name="email" required value="' + esc(S.pendingEmail) + '"></label>' +
    '<button type="submit" class="ghost" style="width:100%">Resend code</button></form>' +
    '<p class="muted"><a href="#login">Back to sign in</a></p>');
  if (view === 'forgot') return box('Reset password', 'We will email you a secure link.',
    '<form data-form="forgot"><label>Email<input type="email" name="email" required autocomplete="email"></label>' +
    '<button type="submit" style="width:100%">Send reset link</button></form>' +
    '<p class="muted"><a href="#login">Back to sign in</a></p>');
  if (view === 'reset') return box('Choose a new password', 'Use at least 8 characters.',
    '<form data-form="reset"><label>New password<input type="password" name="password" minlength="8" required autocomplete="new-password"></label>' +
    '<label>Confirm new password<input type="password" name="confirm" minlength="8" required autocomplete="new-password"></label>' +
    '<button type="submit" style="width:100%">Update password</button></form>');
  return box('Welcome back', 'Sign in to your PrimeCore account.',
    '<form data-form="login"><label>Email<input type="email" name="email" required autocomplete="email"></label>' +
    '<label>Password<input type="password" name="password" required autocomplete="current-password"></label>' +
    '<button type="submit" style="width:100%">Sign in</button></form>' +
    '<p class="muted" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:12px">' +
    '<a href="#forgot">Forgot password?</a><a href="#signup">Create account</a></p>');
}

function renderNav() {
  var links = S.user ? NAV.slice() : [];
  if (S.user && isAdmin()) links.push(['admin', 'Admin']);
  $('#nav').innerHTML = links.map(function (l) {
    return '<a href="#' + l[0] + '" class="' + (S.view === l[0] ? 'on' : '') + '">' + esc(l[1]) + '</a>';
  }).join('');
  $('#logout').style.display = S.user ? '' : 'none';
}

var PAGES = {};
var UID = function () { return S.user.id; };

PAGES.dashboard = async function () {
  var uid = UID();
  var q = await Promise.all([
    sb.from('wallet_balances').select('available_balance,pending_hold').eq('user_id', uid).maybeSingle(),
    sb.from('deposits').select('amount').eq('user_id', uid).eq('status', 'successful'),
    sb.from('investments').select('amount').eq('user_id', uid).eq('status', 'active'),
    sb.from('wallet_ledger').select('amount,kind').eq('user_id', uid).eq('status', 'posted').in('kind', ['task_credit', 'reward_credit', 'referral_credit', 'claim_credit']),
    sb.from('withdrawals').select('amount').eq('user_id', uid).eq('status', 'pending'),
    sb.from('wallet_ledger').select('kind,amount,status,created_at').eq('user_id', uid).order('created_at', { ascending: false }).limit(8),
    sb.rpc('team_tree'),
    sb.from('claim_requests').select('id,category,reward_amount,status,created_at').eq('user_id', uid).order('created_at', { ascending: false }).limit(25),
    loadPlans(),
    loadProgramSettings()
  ]);
  if (q[0].error) return msgHTML() + errorBox(q[0].error);

  var bal = q[0].data || { available_balance: 0, pending_hold: 0 };
  var totalDeposits = sum(q[1].data);
  var verifiedEarnings = sum(q[3].data);
  var pendingWd = sum(q[4].data);
  var validBalance = Number(bal.available_balance || 0);
  var plans = q[8];
  var cfg = q[9];
  var currentPlan = matchPlan(plans, validBalance);

  var teamRows = (!q[6].error && q[6].data) ? q[6].data : [];
  var directRefs = teamRows.filter(function (x) { return x.level === 1; });
  var qualifiedDirect = directRefs.filter(function (x) { return Number(x.deposits || 0) >= Number(cfg.min_qualifying_deposit || 30); });

  var claims = (!q[7].error && q[7].data) ? q[7].data : [];
  var pendingClaims = claims.filter(function (c) { return c.status === 'PENDING'; });
  var successClaims = claims.filter(function (c) { return c.status === 'SUCCESS'; });

  var recent = (q[5].data || []).map(function (t) {
    var neg = t.amount < 0;
    return '<tr><td>' + when(t.created_at) + '</td><td>' + esc(KIND[t.kind] || t.kind) + '</td><td style="color:' +
      (neg ? '#dc2626' : '#059669') + ';font-weight:600">' + (neg ? '−' : '+') + money(Math.abs(t.amount)) +
      '</td><td>' + pill(t.status) + '</td></tr>';
  }).join('');

  var l1Ok = qualifiedDirect.length >= Number(cfg.level_1_target);
  var l2Ok = qualifiedDirect.length >= Number(cfg.level_2_target);
  var l3Ok = qualifiedDirect.length >= Number(cfg.level_3_target);

  return msgHTML() + '<h1>Dashboard</h1>' +
    '<div class="cols4">' +
      stat('Total Deposits', totalDeposits, 'stat') +
      stat('Valid Balance', validBalance, 'stat green') +
      stat('Verified Earnings', verifiedEarnings, 'stat dark') +
      stat('Pending Withdrawals', pendingWd, 'stat amber') +
    '</div>' +
    '<div class="cols3">' +
      '<div class="card">' +
        '<div class="row"><h2>Current Plan</h2>' + (currentPlan ? '<span class="pill p-info">' + esc(currentPlan.name) + '</span>' : '<span class="pill p-off">Below Minimum</span>') + '</div>' +
        (currentPlan
          ? '<p style="margin:6px 0"><b>Proposed Daily Rate: ' + esc(currentPlan.proposed_daily_rate) + '%</b> <span class="muted">(Not guaranteed)</span></p>' +
            '<p class="muted">Tier Range: ' + money(currentPlan.min_amount) + ' – ' + money(currentPlan.max_amount) + ' · Lock: ' + esc(currentPlan.lock_days) + 'd</p>'
          : '<p class="muted">Deposit at least ' + money(plans[0].min_amount) + ' to qualify for <b>' + esc(plans[0].name) + '</b> (Proposed ' + esc(plans[0].proposed_daily_rate) + '%/day).</p>') +
        '<a href="#investment">View all 5 plan tiers →</a>' +
      '</div>' +
      '<div class="card">' +

/* ==================== RENDER & EVENTS ==================== */
function show(view) {
  var target = view || (S.user ? 'dashboard' : 'login');
  if (!S.user && AUTH.indexOf(target) === -1) target = 'login';
  if (S.user && AUTH.indexOf(target) > -1) target = 'dashboard';
  S.view = target;
  if (location.hash.replace(/^#/, '') !== target) {
    history.replaceState(null, '', '#' + target);
  }
  renderNav();
  if (!S.ready) {
    $('#app').innerHTML = '<p class="muted">Loading…</p>';
    return;
  }
  if (!S.user) {
    $('#app').innerHTML = msgHTML() + authHTML(target);
    return;
  }
  var id = ++seq;
  var pageFn = PAGES[target] || PAGES.dashboard;
  pageFn().then(function (html) {
    if (id === seq) $('#app').innerHTML = html;
  }).catch(function (err) {
    if (id === seq) $('#app').innerHTML = errorBox(err);
  });
}

async function refreshSession() {
  if (!sb) {
    S.ready = true;
    S.user = null;
    S.profile = null;
    return;
  }
  var res = await sb.auth.getSession();
  var sess = res && res.data ? res.data.session : null;
  S.user = sess ? sess.user : null;
  if (S.user) {
    var pr = await sb.from('profiles').select('*').eq('id', S.user.id).maybeSingle();
    S.profile = (!pr.error && pr.data) ? pr.data : null;
  } else {
    S.profile = null;
  }
  S.ready = true;
}

document.addEventListener('submit', async function (e) {
  var form = e.target;
  if (!form || !form.dataset || !form.dataset.form) return;
  e.preventDefault();
  if (!sb) {
    setMsg('err', 'Supabase client is not initialized.');
    show(S.view);
    return;
  }
  var kind = form.dataset.form;
  var fd = new FormData(form);
  var btn = form.querySelector('button[type="submit"]');
  if (btn) btn.disabled = true;

  try {
    if (kind === 'login') {
      var email = String(fd.get('email') || '').trim();
      var password = String(fd.get('password') || '');
      var lr = await sb.auth.signInWithPassword({ email: email, password: password });
      if (lr.error) throw lr.error;
      await refreshSession();
      setMsg('ok', 'Signed in successfully.');
      show('dashboard');
    } else if (kind === 'signup') {
      var pw = String(fd.get('password') || '');
      var cpw = String(fd.get('confirm') || '');
      if (pw !== cpw) throw new Error('Passwords do not match.');
      var cParts = String(fd.get('country') || 'PK|+92').split('|');
      var sr = await sb.auth.signUp({
        email: String(fd.get('email') || '').trim(),
        password: pw,
        options: {
          data: {
            full_name: String(fd.get('full_name') || '').trim(),
            username: String(fd.get('username') || '').trim(),
            country: cParts[0],
            phone: String(fd.get('phone') || '').trim()
          }
        }
      });
      if (sr.error) throw sr.error;
      S.pendingEmail = String(fd.get('email') || '').trim();
      setMsg('ok', 'Account created. Enter the verification code sent to your email.');
      show('verify');
    } else if (kind === 'verify') {
      var vr = await sb.auth.verifyOtp({
        email: String(fd.get('email') || '').trim(),
        token: String(fd.get('token') || '').trim(),
        type: 'signup'
      });
      if (vr.error) throw vr.error;
      await refreshSession();
      setMsg('ok', 'Email verified.');
      show('dashboard');
    } else if (kind === 'resend') {
      var rr = await sb.auth.resend({
        type: 'signup',
        email: String(fd.get('email') || '').trim()
      });
      if (rr.error) throw rr.error;
      setMsg('ok', 'Verification code sent.');
      show('verify');
    } else if (kind === 'forgot') {
      var fr = await sb.auth.resetPasswordForEmail(String(fd.get('email') || '').trim());
      if (fr.error) throw fr.error;
      setMsg('ok', 'Reset instructions sent.');
      show('login');
    } else if (kind === 'reset') {
      var npw = String(fd.get('password') || '');
      if (npw !== String(fd.get('confirm') || '')) throw new Error('Passwords do not match.');
      var ur = await sb.auth.updateUser({ password: npw });
      if (ur.error) throw ur.error;
      setMsg('ok', 'Password updated.');
      show('dashboard');
    } else if (kind === 'deposit') {
      var amt = Number(fd.get('amount') || 0);
      if (amt < 10) throw new Error('invalid_amount');
      var dr = await sb.from('deposits').insert({
        user_id: UID(),
        amount: amt,
        method: String(fd.get('method') || 'bank'),
        reference: String(fd.get('reference') || '').trim(),
        status: 'pending'
      });
      if (dr.error) throw dr.error;
      setMsg('ok', 'Deposit request submitted.');
      show('wallet');
    } else if (kind === 'withdraw') {
      var wamt = Number(fd.get('amount') || 0);
      if (wamt < 10) throw new Error('invalid_amount');
      var wr = await sb.from('withdrawals').insert({
        user_id: UID(),
        amount: wamt,
        method: String(fd.get('method') || 'bank'),
        destination: String(fd.get('destination') || '').trim(),
        status: 'pending'
      });
      if (wr.error) throw wr.error;
      setMsg('ok', 'Withdrawal request submitted.');
      show('wallet');
    }
  } catch (err) {
    setMsg('err', friendly(err));
    show(S.view);
  } finally {
    if (btn) btn.disabled = false;
  }
});

document.addEventListener('click', async function (e) {
  var btn = e.target.closest('button[data-act]');
  if (!btn || !sb) return;
  var act = btn.dataset.act;
  var id = btn.dataset.id;
  btn.disabled = true;
  try {
    if (act === 'start') {
      var r1 = await sb.from('task_completions').insert({ user_id: UID(), task_id: id, status: 'started' });
      if (r1.error) throw r1.error;
      setMsg('ok', 'Task started.');
      show('tasks');
    } else if (act === 'submit') {
      var r2 = await sb.from('task_completions').update({ status: 'submitted', submitted_at: new Date().toISOString() }).eq('id', id).eq('user_id', UID());
      if (r2.error) throw r2.error;
      setMsg('ok', 'Task submitted for verification.');
      show('tasks');
    }
  } catch (err) {
    setMsg('err', friendly(err));
    show(S.view);
  } finally {
    btn.disabled = false;
  }
});

$('#logout').addEventListener('click', async function () {
  if (sb) await sb.auth.signOut();
  S.user = null;
  S.profile = null;
  setMsg('ok', 'Signed out.');
  show('login');
});

window.addEventListener('hashchange', function () {
  show(location.hash.replace(/^#/, ''));
});

if (sb && sb.auth && sb.auth.onAuthStateChange) {
  sb.auth.onAuthStateChange(async function (event) {
    if (event === 'PASSWORD_RECOVERY') {
      S.ready = true;
      show('reset');
      return;
    }
    await refreshSession();
    show(S.view);
  });
}

refreshSession().then(function () {
  show(location.hash.replace(/^#/, ''));
});
})();
</script>
</body>
</html>
